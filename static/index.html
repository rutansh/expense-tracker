<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7587;
    --line: #e4e8f0; --accent: #0d9488; --accent-dark: #0f766e; --err: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px 20px;
  }
  main { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .stack { display: grid; gap: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.06);
  }
  label { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; }
  input {
    display: block; width: 100%; margin-top: 5px; padding: 10px 12px; font: inherit; font-weight: 400;
    color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 9px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,.15); }
  button.primary {
    width: 100%; padding: 11px; font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 9px; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-dark); }
  #error { min-height: 20px; margin-top: 10px; color: var(--err); font-size: 13px; }
  .cat { margin-bottom: 14px; }
  .cat:last-child { margin-bottom: 0; }
  .cat-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .cat-name { text-transform: capitalize; font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: #eef1f6; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 0 8px 10px; }
  td { padding: 11px 8px; border-top: 1px solid var(--line); }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  th.num { font-weight: 600; }
  .date { color: var(--muted); white-space: nowrap; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; text-transform: capitalize; }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Expense Tracker</h1>
    <div class="sub">Record what you spend and see where it goes.</div>
  </header>
  <div class="grid">
    <div class="stack">
      <section class="card">
        <h2>Add expense</h2>
        <form id="add-form" novalidate>
          <label>Amount (USD)
            <input id="amount" type="text" inputmode="decimal" placeholder="12.50" autocomplete="off">
          </label>
          <label>Category
            <input id="category" type="text" list="categories" placeholder="groceries" maxlength="50" autocomplete="off">
            <datalist id="categories"></datalist>
          </label>
          <label>Note (optional)
            <input id="note" type="text" placeholder="What was it for?" maxlength="200" autocomplete="off">
          </label>
          <button class="primary" type="submit">Add expense</button>
          <div id="error" role="alert"></div>
        </form>
      </section>
      <section class="card">
        <h2>By category</h2>
        <div id="summary"></div>
      </section>
    </div>
    <section class="card">
      <h2>Expenses</h2>
      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="num">Amount</th></tr></thead>
        <tbody id="expenses"></tbody>
      </table>
    </section>
  </div>
</main>
<script>
  const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const formatMoney = (cents) => money.format(cents / 100);
  const el = (id) => document.getElementById(id);

  // A stable colour per category name, so the same category looks the same everywhere.
  function hue(name) {
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return h;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
    if (!response.ok) {
      throw new Error(response.status === 422
        ? "Enter an amount like 12.50 (at most two decimals) and a category."
        : "Something went wrong (" + response.status + ").");
    }
    return response.json();
  }

  function cell(text, className) {
    const td = document.createElement("td");
    if (className) td.className = className;
    td.textContent = text; // textContent keeps user text from being treated as HTML
    return td;
  }

  function renderExpenses(expenses) {
    const body = el("expenses");
    body.replaceChildren();
    if (expenses.length === 0) {
      const row = document.createElement("tr");
      const td = cell("No expenses yet. Add your first one.", "empty");
      td.colSpan = 4;
      row.append(td);
      body.append(row);
      return;
    }
    const newestFirst = [...expenses].sort((a, b) =>
      b.spent_on.localeCompare(a.spent_on) || b.expense_id - a.expense_id);
    for (const expense of newestFirst) {
      const row = document.createElement("tr");
      const pillCell = document.createElement("td");
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = expense.category;
      pill.style.background = "hsl(" + hue(expense.category) + " 70% 92%)";
      pill.style.color = "hsl(" + hue(expense.category) + " 55% 28%)";
      pillCell.append(pill);
      row.append(cell(expense.spent_on, "date"), pillCell, cell(expense.note),
                 cell(formatMoney(expense.amount_cents), "num"));
      body.append(row);
    }
  }

  function renderSummary(totals) {
    const box = el("summary");
    box.replaceChildren();
    if (totals.length === 0) {
      box.textContent = "Nothing to summarise yet.";
      return;
    }
    const max = Math.max(...totals.map((t) => t.total_cents));
    for (const total of totals) {
      const wrap = document.createElement("div");
      wrap.className = "cat";
      const row = document.createElement("div");
      row.className = "cat-row";
      const name = document.createElement("span");
      name.className = "cat-name";
      name.textContent = total.category;
      const amount = document.createElement("span");
      amount.textContent = formatMoney(total.total_cents);
      row.append(name, amount);
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("span");
      fill.style.width = Math.round((total.total_cents / max) * 100) + "%";
      fill.style.background = "hsl(" + hue(total.category) + " 60% 50%)";
      bar.append(fill);
      wrap.append(row, bar);
      box.append(wrap);
    }
    const list = el("categories");
    list.replaceChildren(...totals.map((t) => Object.assign(document.createElement("option"), { value: t.category })));
  }

  async function load() {
    try {
      const [expenses, totals] = await Promise.all([api("/api/expenses"), api("/api/summary")]);
      renderExpenses(expenses);
      renderSummary(totals);
    } catch (error) { el("error").textContent = error.message; }
  }

  el("add-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    el("error").textContent = "";
    try {
      await api("/api/expenses", {
        method: "POST",
        body: JSON.stringify({ amount: el("amount").value.trim(), category: el("category").value, note: el("note").value }),
      });
      for (const id of ["amount", "category", "note"]) el(id).value = "";
      await load();
      el("amount").focus();
    } catch (error) { el("error").textContent = error.message; }
  });

  load();
</script>
</body>
</html>
